<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MikeyType</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Scope+One&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cascadia+Code:ital,wght@0,200..700;1,200..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="background">
        <nav>
            <h1>MikeyType</h1>
        </nav>
        <footer>
            <img src="./images/windows-xp.png" alt="Windows XP icon" height="45px" width="44px">
            <button onclick="hideGameWindow()"><img src="./images/xp_terminal.png" alt="Windows XP terminal icon" height="48px" width="48px"></button>
        </footer>
    </div>
    <div id="timer">1:00</div>
    <div id="game-window">
        <div id="game-title">
            <img src="./images/xp_terminal.png" alt="Windows XP terminal icon" height="20px" width="20px">
            <p>C:\WINDOWS\system32\MikeyType.exe</p>
        </div>
        <div id="game-container">
            <div id="codeDisplay" class="code-display"></div>
            <textarea id="codeInput" class="code-input" autofocus placeholder="Type here"></textarea>   
            </div>
            </div>
        </div>
    <script src="main.js" defer></script>
</body>

</html>
